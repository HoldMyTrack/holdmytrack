# Minimal single-VPS production deployment. See docs/DEPLOY.md for the full
# runbook (provisioning, R2 setup, DNS, first run). Run with:
#
#   docker compose -f compose.prod.yml --env-file .env.prod up -d
#
# Deliberately a separate, standalone file rather than a compose.yaml override: this stack
# has one fewer service than the dev one (no `rustfs` — object storage is real Cloudflare
# R2 here, reached over the public internet, not a container on this same network) and
# different topology for the one it renames (`web` is Caddy + the built static frontend,
# not the Vite dev server), so treating it as "compose.yaml plus a few tweaks" would be
# more confusing than a clean second file that stands on its own.
#
# No bind mounts anywhere (unlike compose.yaml, which bind-mounts apps/web's source for
# HMR) — every image is fully self-contained, built once, run as-is. `restart:
# unless-stopped` everywhere so a VPS reboot brings the whole stack back without manual
# intervention.

services:
  db:
    # Before moving to an image on Debian 13 or later, see docs/DEPLOY.md §9 (time zones).
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Not published to the host at all — only api/worker/migrate (same Docker network,
    # reached by service name) ever need to reach this. A public VPS has no reason to
    # expose Postgres to the internet, unlike compose.yaml's 127.0.0.1-only dev binding
    # (which exists there for a developer's own local psql/GUI client to reach it).

  # Applies migrations, then exits — api/worker depend on this completing, not on `db`
  # alone, matching compose.yaml's own reasoning for the identical split there.
  migrate:
    image: holdmytrack-server
    build: &server-build
      context: ./services/server
      target: dev
      # The build's git short-SHA — /healthz reports it (services/server/internal/httpapi/
      # server.go) so VersionBanner.tsx can detect a browser tab left open across a deploy.
      # migrate/api/worker all reference this same block (and the same `image:` tag above)
      # so Compose builds the Rust/Go toolchains once, not three times — on a small VPS's
      # disk, building three near-identical images of this Dockerfile is enough on its own
      # to fill it (confirmed live: `no space left on device` mid-build before this fix).
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: "no"
    command: ["migrate"]
    environment: &server-env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # https:// here, not http:// — auth.go's startSession derives the session cookie's
      # Secure flag from this exact value. Get this wrong and sign-in silently breaks (the
      # browser drops a Secure cookie set over a connection it doesn't trust, or drops a
      # non-Secure one it's suspicious of over HTTPS in some browsers) rather than erroring
      # loudly, so it's worth double-checking in .env.prod before first run.
      APP_BASE_URL: ${APP_BASE_URL}
      # The origin the style document GET /v1/map/style/{flavor} hands native clients
      # resolves the basemap against — the same value the web bundle bakes in, so both
      # clients read one archive. Empty falls back to APP_BASE_URL (config.go).
      BASEMAP_ORIGIN: ${VITE_BASEMAP_ORIGIN:-}
      # Sign in with Google (docs/SPEC.md FR-1.9, docs/DEPLOY.md) — optional; empty turns it
      # off. The redirect URL defaults to APP_BASE_URL + /v1/auth/google/callback (config.go),
      # which is right here because Caddy serves the app and the API from one origin.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
    depends_on:
      db: { condition: service_healthy }

  api:
    image: holdmytrack-server
    build: *server-build
    restart: unless-stopped
    command: ["serve"]
    environment: *server-env
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    # No published port — Caddy (the `web` service) reaches this over the Docker network
    # by service name (`api:8080`), never directly from outside.

  worker:
    image: holdmytrack-server
    build: *server-build
    restart: unless-stopped
    command: ["work"]
    environment: *server-env
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # Caddy + the built static frontend (apps/web/Dockerfile's `serve` stage) — the one
  # publicly-reachable service. See apps/web/docker/Caddyfile for what it actually proxies
  # versus serves directly.
  web:
    build:
      context: ./apps/web
      target: serve
      # The R2/CDN origin the basemap archive, fonts and sprites are read from. Empty means
      # same-origin, and since the archive is never baked into this image
      # (apps/web/Dockerfile's own comment explains why) that needs the commented bind
      # mount below. Either way this is a *build*-time value (Vite bakes it into the
      # bundle) — changing it needs `docker compose -f compose.prod.yml build web`, not
      # just a restart.
      args:
        VITE_BASEMAP_ORIGIN: ${VITE_BASEMAP_ORIGIN:-}
        # Same GIT_SHA as the api service's build args, below — baked into the bundle so
        # VersionBanner.tsx can compare its own build against /healthz's version field.
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      # Extra names redirected to DOMAIN alongside www (apps/web/docker/Caddyfile).
      REDIRECT_DOMAINS: ${REDIRECT_DOMAINS:-}
      # Flip via scripts/maintenance.sh (recreates just this container), not by hand — see
      # docs/DEPLOY.md's "Maintenance mode" section and apps/web/docker/Caddyfile.
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}
    volumes:
      # Caddy's own state: the ACME account key and issued certificates (caddy_data) and
      # its config autosave (caddy_config). Without these as named volumes, every
      # `docker compose up` after an image rebuild would re-issue a certificate from
      # scratch against Let's Encrypt's rate limits instead of reusing the one it already
      # has.
      - caddy_data:/data
      - caddy_config:/config
      # Only for a deployment serving the basemap same-origin (VITE_BASEMAP_ORIGIN left
      # unset): bind-mount the archive into the built image's static root at the exact
      # path apps/web/src/map/config.ts's PMTILES_PATH names — no rebuild needed to update
      # it, just a container restart. See docs/DEPLOY.md §5.
      # - /srv/holdmytrack/basemap/basemap.pmtiles:/srv/web/basemap/basemap.pmtiles:ro
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
