{{define "content"}}{{with .Page}}
<main class="auth-page">
  <div class="auth-card">
    <h1 class="auth-card__title">{{t "verify.title"}}</h1>
    <p class="auth-card__hint">{{th "verify_pending.hint" "email" .Email}}</p>
    {{with .Notice}}<p class="auth-card__notice" role="status">{{.}}</p>{{end}}
    {{with .Error}}<p class="auth-card__error" role="alert">{{.}}</p>{{end}}
    <form method="post" action="/verify-pending/resend">
      <button type="submit" class="auth-card__submit">{{t "verify_pending.resend"}}</button>
    </form>
    <form class="auth-card__form" method="post" action="/verify-pending/email">
      <label class="auth-card__field"><span>{{t "verify_pending.change_label"}}</span><input type="email" name="email" value="{{.Email}}" required autocomplete="email" /></label>
      <button type="submit" class="auth-card__secondary">{{t "verify_pending.change_submit"}}</button>
    </form>
    <form method="post" action="/logout">
      <button type="submit" class="auth-card__link auth-card__link--button">{{t "verify_pending.sign_out"}}</button>
    </form>
  </div>
</main>
{{end}}{{end}}
