{{define "content"}}{{with .Page}}
<main class="auth-page">
  <div class="auth-card">
    <h1 class="auth-card__title">{{t "reset.title"}}</h1>
    {{if .Token}}
    <form class="auth-card__form" method="post" action="/reset">
      <input type="hidden" name="token" value="{{.Token}}" />
      <div class="auth-card__field"><label for="password">{{t "reset.password"}}</label><span class="auth-card__password"><input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" />{{template "password-reveal"}}</span></div>
      {{with .Error}}<p class="auth-card__error" role="alert">{{.}}</p>{{end}}
      <button type="submit" class="auth-card__submit">{{t "reset.submit"}}</button>
    </form>
    {{else}}
    {{with .Error}}<p class="auth-card__error" role="alert">{{.}}</p>{{end}}
    <a class="auth-card__link" href="/forgot">{{t "reset.new_link"}}</a>
    {{end}}
  </div>
</main>
<script src="{{asset "password.js"}}" defer></script>
{{end}}{{end}}
