{{define "content"}}{{with .Page}}
<main class="auth-page">
  <div class="auth-card">
    <h1 class="auth-card__title">Set a new password</h1>
    {{if .Token}}
    <form class="auth-card__form" method="post" action="/reset">
      <input type="hidden" name="token" value="{{.Token}}" />
      <label class="auth-card__field"><span>New password</span><input type="password" name="password" required minlength="8" autocomplete="new-password" /></label>
      {{with .Error}}<p class="auth-card__error" role="alert">{{.}}</p>{{end}}
      <button type="submit" class="auth-card__submit">Set new password</button>
    </form>
    {{else}}
    {{with .Error}}<p class="auth-card__error" role="alert">{{.}}</p>{{end}}
    <a class="auth-card__link" href="/forgot">Request a new link</a>
    {{end}}
  </div>
</main>
{{end}}{{end}}
