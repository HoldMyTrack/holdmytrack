{{define "content"}}{{with .Page}}
<main class="auth-page">
  <div class="auth-card">
    <h1 class="auth-card__title">{{t "signin.title"}}</h1>
    {{if or .Google .Facebook}}{{template "providers" .}}{{end}}
    <form class="auth-card__form" method="post" action="/signin">
      <label class="auth-card__field"><span>{{t "auth.email"}}</span><input type="email" name="email" value="{{.Email}}" required autocomplete="email" /></label>
      <label class="auth-card__field"><span>{{t "auth.password"}}</span><input type="password" name="password" required minlength="8" autocomplete="current-password" /></label>
      <a class="auth-card__forgot" href="/forgot">{{t "signin.forgot"}}</a>
      {{with .Error}}<p class="auth-card__error" role="alert">{{.}}</p>{{end}}
      <button type="submit" class="auth-card__submit">{{t "signin.submit"}}</button>
    </form>
    <a class="auth-card__link" href="/signup">{{t "signin.to_signup"}}</a>
    <div class="auth-card__divider" role="separator">{{t "auth.or"}}</div>
    <form method="post" action="/demo">
      <button type="submit" class="auth-card__secondary">{{t "signin.demo"}}</button>
    </form>
  </div>
</main>
{{end}}{{end}}
