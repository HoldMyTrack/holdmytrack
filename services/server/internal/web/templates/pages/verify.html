{{define "content"}}{{with .Page}}
<main class="auth-page">
  <div class="auth-card">
    <h1 class="auth-card__title">Verify your email</h1>
    {{with .Error}}<p class="auth-card__error" role="alert">{{.}}</p>{{end}}
    <p class="auth-card__hint">Sign in to have a new link sent to you.</p>
    <a class="auth-card__link" href="/signin">Sign in</a>
  </div>
</main>
{{end}}{{end}}
