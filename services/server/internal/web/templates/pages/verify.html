{{define "content"}}{{with .Page}}
<main class="auth-page">
  <div class="auth-card">
    <h1 class="auth-card__title">{{t "verify.title"}}</h1>
    {{with .Error}}<p class="auth-card__error" role="alert">{{.}}</p>{{end}}
    <p class="auth-card__hint">{{t "verify.hint"}}</p>
    <a class="auth-card__link" href="/signin">{{t "header.sign_in"}}</a>
  </div>
</main>
{{end}}{{end}}
