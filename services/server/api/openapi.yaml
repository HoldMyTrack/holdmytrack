openapi: 3.0.3
info:
  title: HoldMyTrack API
  version: v1
  description: >-
    The JSON contract between the Go server and its clients. The httpapi package's tests check
    every request and response they make to a path described here against this file, so a
    handler that stops matching it fails CI. A browser's write from another site is
    refused with a plain-text 403 before any operation runs; the operations don't repeat it.
servers:
  - url: /v1
security:
  - session: []
paths:
  /auth/signup:
    post:
      summary: Create a password account and sign in to it
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/PlainError" }
        "409": { $ref: "#/components/responses/PlainError" }
        "429": { $ref: "#/components/responses/PlainError" }
  /auth/login:
    post:
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/PlainError" }
        "429": { $ref: "#/components/responses/PlainError" }
  /auth/logout:
    post:
      summary: End the current session, if any, and clear its cookie
      security: []
      responses:
        "204":
          description: Signed out
  /auth/me:
    get:
      summary: The signed-in account
      security: []
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /auth/demo:
    post:
      summary: Start a session on the shared, read-only demo account
      security: []
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "429": { $ref: "#/components/responses/PlainError" }
  /auth/forgot-password:
    post:
      summary: Email a password reset link, if the address has an account
      description: The same answer whether or not it has one.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/PlainError" }
        "429": { $ref: "#/components/responses/PlainError" }
  /auth/reset-password:
    post:
      summary: Set a new password with a reset link's token, ending every other session, and sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                password: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/PlainError" }
  /auth/verify-email:
    post:
      summary: Verify an address with a verification link's token, and sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/PlainError" }
        "409": { $ref: "#/components/responses/PlainError" }
  /auth/providers:
    get:
      summary: Which sign-in providers this server has configured
      security: []
      responses:
        "200":
          description: The providers
          content:
            application/json:
              schema:
                type: object
                required: [google, facebook]
                additionalProperties: false
                properties:
                  google: { type: boolean }
                  facebook: { type: boolean }
                  google_client_id:
                    type: string
                    description: The web client id a native app asks Google for an id_token with; only when google is true.
  /auth/google/start:
    get:
      summary: Start Sign in with Google in a browser
      description: A page navigation, not a fetch.
      security: []
      parameters:
        - $ref: "#/components/parameters/OAuthTZ"
        - $ref: "#/components/parameters/OAuthAppChallenge"
      responses:
        "302": { $ref: "#/components/responses/Redirect" }
        "400": { $ref: "#/components/responses/PlainError" }
        "404": { $ref: "#/components/responses/PlainError" }
  /auth/google/callback:
    get:
      summary: Where Google sends the browser back
      description: >-
        Redirects to the app with a session cookie, to the sign-in page with ?error=, or for a
        round trip an app started, to holdmytrack://oauth with ?code= or ?error=.
      security: []
      responses:
        "302": { $ref: "#/components/responses/Redirect" }
        "404": { $ref: "#/components/responses/PlainError" }
  /auth/facebook/start:
    get:
      summary: Start Sign in with Facebook in a browser
      description: A page navigation, not a fetch.
      security: []
      parameters:
        - $ref: "#/components/parameters/OAuthTZ"
        - $ref: "#/components/parameters/OAuthAppChallenge"
      responses:
        "302": { $ref: "#/components/responses/Redirect" }
        "400": { $ref: "#/components/responses/PlainError" }
        "404": { $ref: "#/components/responses/PlainError" }
  /auth/facebook/callback:
    get:
      summary: Where Facebook sends the browser back; redirects as Google's callback does
      security: []
      responses:
        "302": { $ref: "#/components/responses/Redirect" }
        "404": { $ref: "#/components/responses/PlainError" }
  /auth/google/token:
    post:
      summary: Sign in with a Google id_token a native app got from the platform
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_token: { type: string }
                tz:
                  type: string
                  description: The device's IANA zone, for a new account.
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/PlainError" }
        "404": { $ref: "#/components/responses/PlainError" }
  /auth/handoff:
    post:
      summary: Redeem the one-time code a browser-tab sign-in handed an app, with the app's PKCE verifier
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                verifier: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/PlainError" }
  /auth/resend-verification:
    post:
      summary: Email the verification link again; works before the account is verified
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/PlainError" }
  /auth/email:
    patch:
      summary: Change the address of an account that isn't verified yet, and send it a new link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
      responses:
        "200":
          description: The account as saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/PlainError" }
        "429": { $ref: "#/components/responses/PlainError" }
  /account:
    delete:
      summary: Delete the account and everything in it
      description: Works before the account is verified; refused for the demo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: The account's address, typed again to confirm.
      responses:
        "204":
          description: Deleted, and signed out
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PlainError" }
  /account/settings:
    patch:
      summary: Save the Settings page (a full replace, but locale)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  description: Trimmed; empty clears it.
                country:
                  type: string
                  description: ISO 3166-1 alpha-2; required.
                timezone:
                  type: string
                  description: An IANA zone; required.
                locale:
                  type: string
                  nullable: true
                  description: A supported language, or empty for automatic; missing or null keeps it.
      responses:
        "200":
          description: The account as saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /account/settings/options:
    get:
      summary: The Settings page's choices, labelled in the request's language
      responses:
        "200":
          description: The choices
          content:
            application/json:
              schema:
                type: object
                required: [countries, timezones, languages]
                additionalProperties: false
                properties:
                  countries:
                    type: array
                    items: { $ref: "#/components/schemas/SettingsOption" }
                  timezones:
                    type: array
                    items:
                      type: object
                      required: [region, label, options]
                      additionalProperties: false
                      properties:
                        region: { type: string }
                        label: { type: string }
                        options:
                          type: array
                          items: { $ref: "#/components/schemas/SettingsOption" }
                  languages:
                    type: array
                    items: { $ref: "#/components/schemas/SettingsOption" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotVerified" }
  /account/avatar:
    get:
      summary: The account's avatar image
      responses:
        "200":
          description: The image, as the type it was sniffed as on upload
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotVerified" }
        "404": { $ref: "#/components/responses/PlainError" }
        "503": { $ref: "#/components/responses/DailyCapacity" }
    post:
      summary: Set the avatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PNG, JPEG or WebP.
      responses:
        "200":
          description: The account as saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PlainError" }
        "415": { $ref: "#/components/responses/PlainError" }
        "503": { $ref: "#/components/responses/PlainError" }
    delete:
      summary: Remove the avatar
      responses:
        "200":
          description: The account as saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /account/export:
    get:
      summary: The latest download of the account's data, if any
      responses:
        "200":
          description: Its state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotVerified" }
    post:
      summary: Prepare a download of the account's data
      description: One already being prepared is answered as it stands rather than started again.
      responses:
        "202":
          description: Being prepared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/PlainError" }
        "503": { $ref: "#/components/responses/PlainError" }
  /account/exports/{id}/parts/{n}:
    parameters:
      - name: id
        in: path
        required: true
        # Not format: uuid — a malformed id is a 404 from the handler, not a request error.
        schema: { type: string }
      - name: n
        in: path
        required: true
        description: The part, from 1.
        schema: { type: string }
    get:
      summary: One part of a ready download, as a zip; Range requests are honoured
      responses:
        "200":
          description: The part
          content:
            application/zip:
              schema: { type: string, format: binary }
        "206":
          description: The requested range of it
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotVerified" }
        "404": { $ref: "#/components/responses/PlainError" }
        "503": { $ref: "#/components/responses/DailyCapacity" }
  /activities:
    get:
      summary: The signed-in account's activities, newest first, unpaginated
      parameters:
        - $ref: "#/components/parameters/FilterFrom"
        - $ref: "#/components/parameters/FilterTo"
        - $ref: "#/components/parameters/FilterTypes"
        - $ref: "#/components/parameters/FilterStory"
      responses:
        "200":
          description: The activities
          content:
            application/json:
              schema:
                type: object
                required: [activities]
                additionalProperties: false
                properties:
                  activities:
                    type: array
                    items: { $ref: "#/components/schemas/ActivityRow" }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotVerified" }
  /activities/upload:
    post:
      summary: Upload one activity file; parsing happens in a job
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: A .gpx, .tcx or .fit file; the extension decides.
      responses:
        "200":
          description: This exact file was imported already
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResult" }
        "202":
          description: Queued for import; GET /activities/status/{external_id} says how it went
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResult" }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/OverLimit" }
        "413": { $ref: "#/components/responses/PlainError" }
        "415": { $ref: "#/components/responses/PlainError" }
        "429": { $ref: "#/components/responses/PlainError" }
        "503": { $ref: "#/components/responses/DailyCapacity" }
  /activities/{id}:
    parameters:
      - $ref: "#/components/parameters/ActivityID"
    patch:
      summary: Change an activity's type, name and description (a full replace)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activity_type]
              properties:
                activity_type:
                  type: string
                  description: Trimmed; blank or longer than 50 bytes is a 400.
                name:
                  type: string
                  description: Trimmed; missing or empty clears it. Longer than 200 bytes is a 400.
                description:
                  type: string
                  description: Trimmed; missing or empty clears it. Longer than 2000 bytes is a 400.
      responses:
        "200":
          description: The activity as saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityRow" }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PlainError" }
    delete:
      summary: Delete an activity, its photos and its stored file
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PlainError" }
  /activities/overlaps:
    post:
      summary: Which of these time spans the account already has an activity overlapping
      description: Lets a client leave out what it would import twice before sending it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                spans:
                  type: array
                  nullable: true
                  maxItems: 5000
                  items:
                    type: object
                    required: [key]
                    properties:
                      key:
                        type: string
                        minLength: 1
                        maxLength: 256
                        description: The client's own name for the span, echoed back on an overlap.
                      start: { type: string, format: date-time }
                      end: { type: string, format: date-time }
      responses:
        "200":
          description: The overlaps
          content:
            application/json:
              schema:
                type: object
                required: [overlaps]
                additionalProperties: false
                properties:
                  overlaps:
                    type: array
                    items:
                      type: object
                      required: [key, activity_id, name, activity_type, started_at, timezone]
                      additionalProperties: false
                      properties:
                        key: { type: string }
                        activity_id: { type: string, format: uuid }
                        name: { type: string }
                        activity_type: { type: string }
                        started_at: { type: string, format: date-time }
                        timezone: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotVerified" }
  /activities/summary:
    get:
      summary: Totals over the activities the filter selects
      parameters:
        - $ref: "#/components/parameters/FilterFrom"
        - $ref: "#/components/parameters/FilterTo"
        - $ref: "#/components/parameters/FilterTypes"
        - $ref: "#/components/parameters/FilterStory"
      responses:
        "200":
          description: The totals
          content:
            application/json:
              schema:
                type: object
                required: [count, distance_meters, duration_seconds, elevation_gain_m]
                additionalProperties: false
                properties:
                  count: { type: integer }
                  distance_meters: { type: number }
                  duration_seconds: { type: integer }
                  elevation_gain_m: { type: number }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotVerified" }
  /activities/histogram:
    get:
      summary: Per-day totals, by a page of activity days or by a calendar window
      description: >-
        With days, the most recent days that have an activity (before `before`, when given);
        otherwise every day with one in from–to, which default to the 12 months up to today.
        Buckets are in ascending date order either way. No type filter; story narrows it to one Story.
      parameters:
        - name: days
          in: query
          description: Activity-day mode, at most this many days (capped by the server).
          schema: { type: integer, minimum: 1 }
        - name: before
          in: query
          description: Activity-day mode, only days strictly before this local date.
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/FilterFrom"
        - $ref: "#/components/parameters/FilterTo"
        - $ref: "#/components/parameters/FilterStory"
      responses:
        "200":
          description: The buckets
          content:
            application/json:
              schema:
                type: object
                required: [bucket, from, to, buckets]
                additionalProperties: false
                properties:
                  bucket: { type: string, enum: [day] }
                  from:
                    type: string
                    description: The window, inclusive; in activity-day mode the first returned day, empty when none was.
                  to:
                    type: string
                    description: The window, inclusive; in activity-day mode the last returned day, empty when none was.
                  buckets:
                    type: array
                    items:
                      type: object
                      required: [date, count, distance_meters]
                      additionalProperties: false
                      properties:
                        date: { type: string, format: date }
                        count: { type: integer }
                        distance_meters: { type: number }
                  earliest:
                    type: string
                    format: date
                    description: The local day of the first activity at all (in the Story, with story); missing when there is none.
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotVerified" }
  /activities/graph-stats:
    get:
      summary: The activity graph's cards, for one year and for all time
      parameters:
        - name: year
          in: query
          description: Defaults to the current year in the account's zone.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The statistics
          content:
            application/json:
              schema:
                type: object
                required: [year, year_stats, all_time]
                additionalProperties: false
                properties:
                  year: { type: integer }
                  year_stats: { $ref: "#/components/schemas/ActivityStatsBlock" }
                  all_time: { $ref: "#/components/schemas/ActivityStatsBlock" }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotVerified" }
  /activities/trends:
    get:
      summary: Totals per week or month, every period in the window included
      parameters:
        - name: bucket
          in: query
          schema: { type: string, enum: [week, month], default: week }
        - name: from
          in: query
          description: Local date, inclusive; defaults to 12 months before to.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Local date, inclusive; defaults to today.
          schema: { type: string, format: date }
      responses:
        "200":
          description: The periods, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [bucket, from, to, periods]
                additionalProperties: false
                properties:
                  bucket: { type: string, enum: [week, month] }
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  periods:
                    type: array
                    items:
                      type: object
                      required: [period_start, count, distance_meters, moving_seconds, elevation_gain_m]
                      additionalProperties: false
                      properties:
                        period_start: { type: string, format: date }
                        count: { type: integer }
                        distance_meters: { type: number }
                        moving_seconds: { type: integer }
                        elevation_gain_m: { type: number }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotVerified" }
  /activities/status/{external_id}:
    parameters:
      - name: external_id
        in: path
        required: true
        description: What the upload answered with.
        schema: { type: string }
    get:
      summary: How the caller's latest import of this file went
      responses:
        "200":
          description: Its state
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    description: processing, done, failed, or unknown when the caller never uploaded it.
                  error:
                    type: string
                    description: Why it failed, in the request's language; only with failed.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotVerified" }
  /activities/track-metrics/{id}:
    parameters:
      - $ref: "#/components/parameters/ActivityID"
    get:
      summary: The stored track's points with their speed, for the speed chart
      responses:
        "200":
          description: The points, in order
          content:
            application/json:
              schema:
                type: object
                required: [activity_id, points]
                additionalProperties: false
                properties:
                  activity_id: { type: string, format: uuid }
                  points:
                    type: array
                    items:
                      type: object
                      required: [lon, lat, speed_mps, time_s]
                      additionalProperties: false
                      properties:
                        lon: { type: number }
                        lat: { type: number }
                        speed_mps: { type: number }
                        time_s:
                          type: integer
                          description: Unix seconds.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotVerified" }
        "404": { $ref: "#/components/responses/PlainError" }
  /activities/track-points/{id}:
    parameters:
      - $ref: "#/components/parameters/ActivityID"
    get:
      summary: Every point the activity was processed from, clipped by Private locations, and the user's edit of them
      responses:
        "200":
          description: The points and the edit
          content:
            application/json:
              schema:
                type: object
                required: [points, edit]
                additionalProperties: false
                properties:
                  points:
                    type: array
                    description: "[lon, lat, t], t in unix milliseconds."
                    items:
                      type: array
                      minItems: 3
                      maxItems: 3
                      items: { type: number }
                  edit:
                    allOf:
                      - { $ref: "#/components/schemas/TrackEdit" }
                    nullable: true
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotVerified" }
        "404": { $ref: "#/components/responses/PlainError" }
        "409": { $ref: "#/components/responses/PlainError" }
        "429": { $ref: "#/components/responses/PlainError" }
        "503": { $ref: "#/components/responses/DailyCapacity" }
  /activities/track-edit/{id}:
    parameters:
      - $ref: "#/components/parameters/ActivityID"
    post:
      summary: Replace the activity's track edit, optionally splitting it; reprocessed in a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                edit:
                  description: The complete new edit, not a delta; null or empty resets to the original track.
                  allOf:
                    - { $ref: "#/components/schemas/TrackEdit" }
                  nullable: true
                split_at:
                  type: integer
                  nullable: true
                  description: Also split the activity at this point (unix milliseconds).
                allow_hidden:
                  type: boolean
                  description: Go ahead with a split that leaves a piece entirely inside Private locations.
      responses:
        "202":
          description: Queued; the activity reads pending until it's done
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PlainError" }
        "409": { $ref: "#/components/responses/PlainError" }
        "422":
          description: The split would leave a piece with no track; resend with allow_hidden once the user agrees
          content:
            application/json:
              schema:
                type: object
                required: [error, message]
                additionalProperties: false
                properties:
                  error: { type: string, enum: [split_hides_part] }
                  message: { type: string }
  /activities/track-merge:
    post:
      summary: Join adjacent pieces of one split back into one activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  nullable: true
                  maxItems: 100
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: The activity they became, which reads pending until its track is rebuilt, and the ids now gone
          content:
            application/json:
              schema:
                type: object
                required: [id, removed]
                additionalProperties: false
                properties:
                  id: { type: string, format: uuid }
                  removed:
                    type: array
                    items: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/PlainError" }
  /map/style/{flavor}:
    parameters:
      - name: flavor
        in: path
        required: true
        description: One of the styles embedded in internal/mapstyle (light, dark, …); a trailing .json is ignored.
        schema: { type: string }
    get:
      summary: A MapLibre style document for the basemap
      description: Public, so a client can draw a map before anyone signs in; it holds no account's data.
      security: []
      parameters:
        - name: lang
          in: query
          description: The labels' language, by its primary subtag; an unsupported one, or none, is English.
          schema: { type: string }
      responses:
        "200":
          description: The style; revalidate with its ETag
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                description: A MapLibre style (its own specification), not one of this API's shapes.
                required: [version, sources, layers]
                properties:
                  version: { type: integer, enum: [8] }
                  sources: { type: object }
                  layers:
                    type: array
                    items: { type: object }
        "304":
          description: Unchanged since the If-None-Match ETag
        "404": { $ref: "#/components/responses/PlainError" }
  /photos:
    get:
      summary: One activity's photos, or those of every activity in a Story, in route order
      description: Exactly one of activity and story; activity wins when both are sent.
      parameters:
        - name: activity
          in: query
          schema: { type: string }
        - name: story
          in: query
          schema: { type: string }
      responses:
        "200":
          description: The photos
          content:
            application/json:
              schema:
                type: object
                required: [photos]
                additionalProperties: false
                properties:
                  photos:
                    type: array
                    items: { $ref: "#/components/schemas/Photo" }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotVerified" }
        "404": { $ref: "#/components/responses/PlainError" }
    post:
      summary: Add a photo to an activity, placed on its track
      description: >-
        The client sends a resized copy and its thumbnail, plus what it read from the original's
        EXIF before resizing. One the server can't place is refused with 422 photo_needs_place,
        and the client sends it again with the user's route_at.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [activity_id, file, thumb]
              properties:
                activity_id: { type: string }
                file:
                  type: string
                  format: binary
                  description: JPEG or WebP, at most 3 MiB and 2560 px on its long side.
                thumb:
                  type: string
                  format: binary
                  description: JPEG or WebP, at most 256 KiB and 640 px on its long side.
                taken_at:
                  type: string
                  description: RFC 3339, when the file says its zone or carries a GPS time.
                taken_local:
                  type: string
                  description: 2006-01-02T15:04:05, a camera clock with no zone.
                lat: { type: number }
                lon: { type: number }
                route_at:
                  type: string
                  description: RFC 3339, where on the track the user put it.
                caption:
                  type: string
                  description: Trimmed; empty means none. Longer than 500 characters is a 400.
      responses:
        "201":
          description: The new photo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Photo" }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PlainError" }
        "409":
          description: The account has the most photos allowed, or the activity has no track to put it on
          content:
            text/plain:
              schema: { type: string }
        "413": { $ref: "#/components/responses/PlainError" }
        "415": { $ref: "#/components/responses/PlainError" }
        "422":
          description: >-
            JSON photo_needs_place when nothing places the photo on the track (ask the user where
            and send route_at); plain text when an image is larger on a side than allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotoNeedsPlace" }
            text/plain:
              schema: { type: string }
        "503": { $ref: "#/components/responses/DailyCapacity" }
  /photos/place:
    post:
      summary: Where an upload with these fields would be placed, storing nothing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                activity_id: { type: string }
                taken_at:
                  type: string
                  description: RFC 3339; missing or empty when unknown.
                taken_local:
                  type: string
                  description: 2006-01-02T15:04:05; missing or empty when unknown.
                lat: { type: number, nullable: true }
                lon: { type: number, nullable: true }
      responses:
        "200":
          description: The place
          content:
            application/json:
              schema:
                type: object
                required: [route_at, taken_at]
                additionalProperties: false
                properties:
                  route_at: { type: string, format: date-time }
                  taken_at: { type: string, format: date-time, nullable: true }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PlainError" }
        "409": { $ref: "#/components/responses/PlainError" }
        "422": { $ref: "#/components/responses/PhotoNeedsPlace" }
  /photos/{id}:
    parameters:
      - $ref: "#/components/parameters/PhotoID"
    get:
      summary: The photo's image; it never changes under its id
      responses:
        "200": { $ref: "#/components/responses/PhotoImage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotVerified" }
        "404": { $ref: "#/components/responses/PlainError" }
        "503": { $ref: "#/components/responses/DailyCapacity" }
    patch:
      summary: Change a photo's caption or its place on the track; only the fields sent change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                caption:
                  type: string
                  nullable: true
                  description: Trimmed; null or empty clears it. Longer than 500 characters is a 400.
                route_at:
                  type: string
                  format: date-time
                  description: The photo's new moment on the track, clamped to it. Null is a 400.
      responses:
        "200":
          description: The photo as saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Photo" }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PlainError" }
        "409": { $ref: "#/components/responses/PlainError" }
    delete:
      summary: Remove a photo
      responses:
        "204":
          description: Removed
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PlainError" }
  /photos/{id}/thumb:
    parameters:
      - $ref: "#/components/parameters/PhotoID"
    get:
      summary: The photo's thumbnail; it never changes under its id
      responses:
        "200": { $ref: "#/components/responses/PhotoImage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotVerified" }
        "404": { $ref: "#/components/responses/PlainError" }
        "503": { $ref: "#/components/responses/DailyCapacity" }
  /private-locations:
    get:
      summary: The signed-in account's Private locations, oldest first
      responses:
        "200":
          description: The Private locations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PrivateLocation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotVerified" }
    post:
      summary: Add a Private location
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivateLocationInput" }
      responses:
        "201":
          description: The new Private location
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateLocation" }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The account already has the most Private locations allowed
          content:
            text/plain:
              schema: { type: string }
  /private-locations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        # Not format: uuid — a malformed id is a 404 from the handler, not a request error.
        schema: { type: string }
    patch:
      summary: Move, resize or rename a Private location (a full replace)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivateLocationInput" }
      responses:
        "200":
          description: The Private location as saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateLocation" }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PlainError" }
    delete:
      summary: Remove a Private location
      responses:
        "204":
          description: Removed
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PlainError" }
  /stories:
    get:
      summary: The signed-in account's Stories, newest first, each with its members and statistics
      responses:
        "200":
          description: The Stories
          content:
            application/json:
              schema:
                type: object
                required: [stories]
                additionalProperties: false
                properties:
                  stories:
                    type: array
                    items: { $ref: "#/components/schemas/Story" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotVerified" }
    post:
      summary: Create a Story, optionally with its first activities
      description: Any activity that isn't the caller's own fails the whole request with a 404 and creates nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/StoryInput" }
                - type: object
                  properties:
                    activity_ids: { $ref: "#/components/schemas/ActivityIDs" }
      responses:
        "201":
          description: The new Story
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PlainError" }
  /stories/{id}:
    parameters:
      - $ref: "#/components/parameters/StoryID"
    get:
      summary: One of the signed-in account's Stories
      responses:
        "200":
          description: The Story
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotVerified" }
        "404": { $ref: "#/components/responses/PlainError" }
    patch:
      summary: Rename a Story or change its description (a full replace)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoryInput" }
      responses:
        "200":
          description: The Story as saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PlainError" }
    delete:
      summary: Delete a Story; its activities stay
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PlainError" }
  /stories/{id}/activities:
    parameters:
      - $ref: "#/components/parameters/StoryID"
    post:
      summary: Add activities to a Story
      description: One already in the Story is left as it is; one that isn't the caller's own fails the whole request with a 404 and adds nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoryActivitiesInput" }
      responses:
        "200":
          description: The Story as saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PlainError" }
    delete:
      summary: Take activities out of a Story; an id not in it is ignored, and the activities stay
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoryActivitiesInput" }
      responses:
        "200":
          description: The Story as saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PlainError" }
  /stories/{id}/send:
    parameters:
      - $ref: "#/components/parameters/StoryID"
    post:
      summary: Send a copy of a Story to another account by email address
      description: 204 whether or not the address belongs to an account that can receive it, so the answer doesn't tell the sender who has an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
      responses:
        "204":
          description: Sent, or silently not
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PlainError" }
        "429": { $ref: "#/components/responses/PlainError" }
  /story-sends:
    get:
      summary: Copies of Stories waiting for the signed-in account, newest first, and accepted ones still being copied
      responses:
        "200":
          description: The waiting and arriving copies
          content:
            application/json:
              schema:
                type: object
                required: [sends, copying]
                additionalProperties: false
                properties:
                  sends:
                    type: array
                    items:
                      type: object
                      required: [id, story_name, from, sent_at, activity_count]
                      additionalProperties: false
                      properties:
                        id: { type: string, format: uuid }
                        story_name: { type: string }
                        from:
                          type: string
                          description: The sender's name, or their email address when they've set none.
                        sent_at: { type: string, format: date-time }
                        activity_count: { type: integer }
                  copying:
                    type: array
                    items:
                      type: object
                      required: [story_name, from]
                      additionalProperties: false
                      properties:
                        story_name: { type: string }
                        from: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotVerified" }
  /story-sends/{id}/accept:
    parameters:
      - $ref: "#/components/parameters/StorySendID"
    post:
      summary: Accept a copy; the Story arrives once its copy job has run
      responses:
        "202":
          description: Accepted, copy queued
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PlainError" }
        "409": { $ref: "#/components/responses/OverLimit" }
        "503": { $ref: "#/components/responses/DailyCapacity" }
  /story-sends/{id}:
    parameters:
      - $ref: "#/components/parameters/StorySendID"
    delete:
      summary: Decline a copy; nothing is copied
      responses:
        "204":
          description: Declined
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PlainError" }
  /uploads:
    get:
      summary: The account's import history, newest first, a page at a time
      parameters:
        - name: limit
          in: query
          description: Defaults to 5; anything over 50 is 50.
          schema: { type: integer, minimum: 1 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0 }
        - name: source
          in: query
          description: Comma-separated sources (upload, takeout, healthconnect, healthkit, recorded); every source when missing.
          schema: { type: string }
      responses:
        "200":
          description: The page
          content:
            application/json:
              schema:
                type: object
                required: [total, processing, limit, offset, uploads]
                additionalProperties: false
                properties:
                  total:
                    type: integer
                    description: How many imports the source filter matches.
                  processing:
                    type: integer
                    description: How many imports are still running, whatever the source filter.
                  limit: { type: integer }
                  offset: { type: integer }
                  uploads:
                    type: array
                    items:
                      type: object
                      required: [filename, external_id, source, status, submitted_at]
                      additionalProperties: false
                      properties:
                        filename: { type: string }
                        external_id: { type: string }
                        source: { type: string }
                        status:
                          type: string
                          description: processing, done or failed.
                        error:
                          type: string
                          description: Why it failed, in the request's language; only with failed.
                        submitted_at: { type: string, format: date-time }
                        finished_at: { type: string, format: date-time }
                        started_at:
                          type: string
                          format: date-time
                          description: The activity's start, once there is one, like timezone, distance_meters and activity_id.
                        timezone: { type: string }
                        distance_meters: { type: number }
                        activity_id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotVerified" }
  /uploads/active:
    get:
      summary: Imports still running, grouped by batch, and how many failures the account hasn't seen
      responses:
        "200":
          description: The running imports
          content:
            application/json:
              schema:
                type: object
                required: [imports, unseen_failures]
                additionalProperties: false
                properties:
                  imports:
                    type: array
                    items:
                      type: object
                      required: [title, source, done, total, submitted_at]
                      additionalProperties: false
                      properties:
                        title: { type: string }
                        source: { type: string }
                        done: { type: integer }
                        total: { type: integer }
                        submitted_at: { type: string, format: date-time }
                  unseen_failures: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotVerified" }
  /coverage/status:
    get:
      summary: Whether the account's map is being rendered, and its tile version
      responses:
        "200":
          description: The status
          content:
            application/json:
              schema:
                type: object
                required: [rendering, version, tile_version]
                additionalProperties: false
                properties:
                  rendering: { type: boolean }
                  version:
                    type: integer
                    description: Changes whenever what the account's tiles return does; a client refetches tiles when it does.
                  tile_version: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotVerified" }
  /sync/activities:
    post:
      summary: Send activities recorded on the device or read from a health service, as points
      description: Each activity gets its own result; one rejected doesn't stop the rest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source: { $ref: "#/components/schemas/SyncSource" }
                activities:
                  type: array
                  nullable: true
                  maxItems: 100
                  items:
                    type: object
                    properties:
                      external_id:
                        type: string
                        description: The source's own id; one that doesn't match SyncExternalID rejects that activity, not the request.
                      activity_type: { type: string }
                      name: { type: string }
                      description: { type: string }
                      points:
                        type: array
                        nullable: true
                        items:
                          type: object
                          properties:
                            lat: { type: number }
                            lon: { type: number }
                            elevation_m: { type: number, nullable: true }
                            time: { type: string, format: date-time }
      responses:
        "200":
          description: One result per activity, in the order sent
          content:
            application/json:
              schema:
                type: object
                required: [results]
                additionalProperties: false
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [external_id, status]
                      additionalProperties: false
                      properties:
                        external_id: { type: string }
                        status: { type: string, enum: [enqueued, already_processed, rejected] }
                        error:
                          type: string
                          description: Why it was rejected, in the request's language; only with rejected.
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/PlainError" }
        "503": { $ref: "#/components/responses/DailyCapacity" }
  /sync/known:
    post:
      summary: Which of these external ids the account already has, or is still importing, from a source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source: { $ref: "#/components/schemas/SyncSource" }
                external_ids:
                  type: array
                  nullable: true
                  maxItems: 5000
                  items: { $ref: "#/components/schemas/SyncExternalID" }
      responses:
        "200":
          description: The ones it has
          content:
            application/json:
              schema:
                type: object
                required: [known, processing]
                additionalProperties: false
                properties:
                  known:
                    type: array
                    items: { type: string }
                  processing:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /spots:
    get:
      summary: The places in an area, in the chosen categories ("Show in this area")
      parameters:
        - name: bbox
          in: query
          required: true
          description: west,south,east,north in degrees; west may be greater than east across the antimeridian.
          schema: { type: string }
        - name: categories
          in: query
          required: true
          description: Comma-separated, from playground, dog_park, monument, viewpoint, history.
          schema: { type: string }
      responses:
        "200":
          description: The places, at most 2,000
          content:
            application/json:
              schema:
                type: object
                required: [spots, total]
                additionalProperties: false
                properties:
                  spots:
                    type: array
                    items: { $ref: "#/components/schemas/Spot" }
                  total:
                    type: integer
                    description: How many the area holds; more than the spots returned when they were cut off.
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotVerified" }
  /spots/captures:
    get:
      summary: Every place the account has captured, newest first
      parameters:
        - name: since
          in: query
          description: Only captures at or after this time (RFC 3339).
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: The captures
          content:
            application/json:
              schema:
                type: object
                required: [captures]
                additionalProperties: false
                properties:
                  captures:
                    type: array
                    items: { $ref: "#/components/schemas/SpotCapture" }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotVerified" }
  /spots/{id}:
    parameters:
      - $ref: "#/components/parameters/SpotID"
    get:
      summary: One place with its whole area and the account's capture of it
      responses:
        "200":
          description: The place
          content:
            application/json:
              schema:
                type: object
                required: [id, category, lon, lat, area]
                additionalProperties: false
                properties:
                  id: { type: integer }
                  category: { type: string }
                  name: { type: string }
                  address: { type: string }
                  description: { type: string }
                  inscription: { type: string }
                  memorial: { type: string }
                  start_date: { type: string }
                  wikipedia: { type: string }
                  lon: { type: number }
                  lat: { type: number }
                  area:
                    type: object
                    description: A GeoJSON MultiPolygon.
                  captured_at:
                    type: string
                    format: date-time
                    description: Missing when the account hasn't captured it.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotVerified" }
        "404": { $ref: "#/components/responses/PlainError" }
  /spots/{id}/captures:
    parameters:
      - $ref: "#/components/parameters/SpotID"
    post:
      summary: Capture a place from the last position the phone measured inside it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lon]
              properties:
                lat: { type: number, minimum: -90, maximum: 90 }
                lon: { type: number, minimum: -180, maximum: 180 }
      responses:
        "200":
          description: Captured already; the first capture's time
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpotCapture" }
        "201":
          description: Captured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpotCapture" }
        "400": { $ref: "#/components/responses/PlainError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PlainError" }
        "410":
          description: The place is no longer on the map
          content:
            text/plain:
              schema: { type: string }
        "422":
          description: The position is outside the place
          content:
            text/plain:
              schema: { type: string }
components:
  parameters:
    OAuthTZ:
      name: tz
      in: query
      description: The browser's IANA zone, for a new account; anything invalid is ignored.
      schema: { type: string }
    OAuthAppChallenge:
      name: app_challenge
      in: query
      description: A native app's S256 PKCE challenge; the round trip then ends in the app with a one-time code.
      schema: { type: string }
    FilterFrom:
      name: from
      in: query
      description: Local start date, inclusive.
      schema: { type: string, format: date }
    FilterTo:
      name: to
      in: query
      description: Local start date, inclusive.
      schema: { type: string, format: date }
    FilterTypes:
      name: types
      in: query
      description: Comma-separated activity types.
      schema: { type: string }
    FilterStory:
      name: story
      in: query
      description: One Story's activities only.
      schema: { type: string, format: uuid }
    ActivityID:
      name: id
      in: path
      required: true
      # Not format: uuid — a malformed id is a 404 from the handler, not a request error.
      schema: { type: string }
    PhotoID:
      name: id
      in: path
      required: true
      # Not format: uuid — a malformed id is a 404 from the handler, not a request error.
      schema: { type: string }
    SpotID:
      name: id
      in: path
      required: true
      # Not an integer — a malformed id is a 404 from the handler, not a request error.
      schema: { type: string }
    StoryID:
      name: id
      in: path
      required: true
      # Not format: uuid — a malformed id is a 404 from the handler, not a request error.
      schema: { type: string }
    StorySendID:
      name: id
      in: path
      required: true
      # Not format: uuid — a malformed id is a 404 from the handler, not a request error.
      schema: { type: string }
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: A session id, as a bearer token or the session cookie.
  responses:
    PlainError:
      description: A message to show the user
      content:
        text/plain:
          schema: { type: string }
    Unauthenticated:
      description: No live session
      content:
        text/plain:
          schema: { type: string }
    NotVerified:
      description: The account's email isn't verified yet
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CodedError" }
    Forbidden:
      description: The account's email isn't verified yet, or it is the read-only demo
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CodedError" }
    Session:
      description: Signed in; the session is also set as a cookie
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AccountWithSession" }
    Message:
      description: A message to show the user
      content:
        application/json:
          schema:
            type: object
            required: [message]
            additionalProperties: false
            properties:
              message: { type: string }
    Redirect:
      description: A redirect
      headers:
        Location:
          schema: { type: string }
    PhotoNeedsPlace:
      description: Nothing places the photo on the track; ask the user where and send route_at
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PhotoNeedsPlace" }
    PhotoImage:
      description: The image, as the type it was sniffed as on upload
      content:
        image/jpeg:
          schema: { type: string, format: binary }
        image/webp:
          schema: { type: string, format: binary }
    OverLimit:
      description: The account is at its activity or storage limit
      content:
        text/plain:
          schema: { type: string }
    DailyCapacity:
      description: The service has reached its daily capacity; try again after Retry-After
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        text/plain:
          schema: { type: string }
  schemas:
    CodedError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          enum: [email_not_verified, demo_read_only]
        message: { type: string }
    ActivityRow:
      type: object
      required: [id, started_at, timezone, activity_type, name, distance_meters, duration_seconds, description, bbox, pending, edited, private, split, stories]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        started_at: { type: string, format: date-time }
        timezone:
          type: string
          description: The IANA zone it was recorded in; a client shows its times in it.
        activity_type: { type: string }
        name: { type: string, nullable: true }
        distance_meters: { type: number, nullable: true }
        duration_seconds: { type: integer, nullable: true }
        description: { type: string, nullable: true }
        bbox:
          type: array
          nullable: true
          description: "[minLon, minLat, maxLon, maxLat], or null when the activity has no track."
          minItems: 4
          maxItems: 4
          items: { type: number }
        pending: { type: boolean }
        edited: { type: boolean }
        private: { type: boolean }
        split:
          type: object
          nullable: true
          required: [group, from, to]
          additionalProperties: false
          properties:
            group: { type: string, format: uuid }
            from: { type: integer, format: int64, nullable: true }
            to: { type: integer, format: int64, nullable: true }
        stories:
          type: array
          items:
            type: object
            required: [id, name]
            additionalProperties: false
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
    PrivateLocationInput:
      type: object
      required: [lon, lat, radius_m]
      properties:
        name:
          type: string
          maxLength: 100
          description: Missing or empty leaves the Private location unnamed.
        lon: { type: number, minimum: -180, maximum: 180 }
        lat: { type: number, minimum: -85, maximum: 85 }
        radius_m: { type: integer, minimum: 50, maximum: 2000 }
    PrivateLocation:
      type: object
      required: [id, name, lon, lat, radius_m]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        lon: { type: number }
        lat: { type: number }
        radius_m: { type: integer }
    StoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Trimmed; blank or longer than 200 characters is a 400.
        description:
          type: string
          description: Trimmed; missing or empty leaves the Story without one. Longer than 2000 characters is a 400.
    ActivityIDs:
      type: array
      nullable: true
      maxItems: 10000
      description: Duplicates are ignored; missing or null adds none.
      items: { type: string, format: uuid }
    StoryActivitiesInput:
      type: object
      required: [activity_ids]
      properties:
        activity_ids:
          type: array
          minItems: 1
          maxItems: 10000
          description: Duplicates are ignored.
          items: { type: string, format: uuid }
    Story:
      type: object
      required: [id, name, description, created_at, updated_at, from, activity_ids, stats]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        from:
          type: string
          nullable: true
          description: Who sent the copy this Story came from, while the Story it was copied from still exists; null for the account's own.
        activity_ids:
          type: array
          description: Every member, oldest activity first.
          items: { type: string, format: uuid }
        stats:
          type: object
          description: Joint statistics over every member, with no date bound.
          required: [count, distance_meters, moving_seconds, elapsed_seconds, by_type]
          additionalProperties: false
          properties:
            count: { type: integer }
            distance_meters: { type: number }
            moving_seconds: { type: integer }
            elapsed_seconds: { type: integer }
            by_type:
              type: array
              description: The same per activity type, most frequent first.
              items:
                type: object
                required: [activity_type, count, distance_meters, moving_seconds, elapsed_seconds]
                additionalProperties: false
                properties:
                  activity_type: { type: string }
                  count: { type: integer }
                  distance_meters: { type: number }
                  moving_seconds: { type: integer }
                  elapsed_seconds: { type: integer }
    UploadResult:
      type: object
      required: [status, external_id, filename]
      additionalProperties: false
      properties:
        status: { type: string, enum: [enqueued, already_processed] }
        external_id:
          type: string
          description: The file's SHA-256, what GET /activities/status/{external_id} takes.
        filename: { type: string }
    ActivityStatsBlock:
      type: object
      required: [count, distance_meters, active_days, longest_streak_days]
      additionalProperties: false
      properties:
        count: { type: integer }
        distance_meters: { type: number }
        active_days: { type: integer }
        longest_streak_days: { type: integer }
    TrackEdit:
      type: object
      description: Points are addressed by their timestamp, in unix milliseconds.
      additionalProperties: false
      properties:
        keep:
          type: array
          description: "[first, last]: only the points in this range are kept."
          minItems: 2
          maxItems: 2
          items: { type: integer }
        remove:
          type: array
          description: "[first, last] ranges of points removed."
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: integer }
        drop:
          type: array
          description: Single points removed.
          items: { type: integer }
        move:
          type: object
          description: Moved points, keyed by timestamp, to [lon, lat].
          additionalProperties:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number }
    Photo:
      type: object
      required: [id, activity_id, taken_at, route_at, timezone, lon, lat, caption, width, height, url, thumb_url]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        activity_id: { type: string, format: uuid }
        taken_at:
          type: string
          format: date-time
          nullable: true
          description: When the camera says it was taken; null when it didn't say.
        route_at:
          type: string
          format: date-time
          description: Its moment on the track, which places it there.
        timezone:
          type: string
          description: The activity's IANA zone; a client shows the photo's times in it.
        lon:
          type: number
          nullable: true
          description: Its position on the track at route_at; null when the activity has no track.
        lat: { type: number, nullable: true }
        caption: { type: string, nullable: true }
        width: { type: integer }
        height: { type: integer }
        url:
          type: string
          description: The image, a path under the API.
        thumb_url: { type: string }
    PhotoNeedsPlace:
      type: object
      required: [error, message]
      additionalProperties: false
      properties:
        error: { type: string, enum: [photo_needs_place] }
        message: { type: string }
    Credentials:
      type: object
      properties:
        email: { type: string }
        password:
          type: string
          description: A password shorter than the minimum or longer than the maximum is a 400.
        timezone:
          type: string
          description: The browser's IANA zone, for a new account; anything invalid falls back to UTC.
    Account:
      type: object
      required: [email, isDemo, email_verified, display_name, country, avatar_url, timezone, locale]
      additionalProperties: false
      properties:
        email:
          type: string
          description: Empty for the demo.
        isDemo: { type: boolean }
        email_verified:
          type: boolean
          description: Always true for the demo.
        display_name:
          type: string
          description: Empty when unset, like country and avatar_url.
        country: { type: string }
        avatar_url: { type: string }
        timezone: { type: string }
        locale:
          type: string
          description: Empty for automatic.
    AccountWithSession:
      type: object
      required: [session_token, email, isDemo, email_verified, display_name, country, avatar_url, timezone, locale]
      additionalProperties: false
      description: The Account, and the session's token.
      properties:
        session_token:
          type: string
          description: The session cookie's value, for a client with no cookie jar to send as a bearer token.
        email:
          type: string
          description: Empty for the demo.
        isDemo: { type: boolean }
        email_verified:
          type: boolean
          description: Always true for the demo.
        display_name:
          type: string
          description: Empty when unset, like country and avatar_url.
        country: { type: string }
        avatar_url: { type: string }
        timezone: { type: string }
        locale:
          type: string
          description: Empty for automatic.
    SettingsOption:
      type: object
      required: [value, label]
      additionalProperties: false
      properties:
        value: { type: string }
        label: { type: string }
    ExportStatus:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state: { type: string, enum: [none, preparing, ready, failed] }
        id: { type: string, format: uuid }
        requested_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: Only when ready, like total_size and parts.
        total_size: { type: integer }
        parts:
          type: array
          items:
            type: object
            required: [n, size, name, url]
            additionalProperties: false
            properties:
              n: { type: integer }
              size: { type: integer }
              name:
                type: string
                description: The file it downloads as.
              url:
                type: string
                description: Relative to the site.
    SyncSource:
      type: string
      enum: [healthconnect, healthkit, recorded]
    SyncExternalID:
      type: string
      pattern: "^[A-Za-z0-9_-][A-Za-z0-9._-]{0,199}$"
      description: The source's own id for the activity.
    Spot:
      type: object
      required: [id, category, lon, lat]
      additionalProperties: false
      description: A place; each text field is missing when the map data has none.
      properties:
        id: { type: integer }
        category: { type: string, enum: [playground, dog_park, monument, viewpoint, history] }
        name: { type: string }
        address: { type: string }
        description: { type: string }
        inscription: { type: string }
        memorial: { type: string }
        start_date: { type: string }
        wikipedia: { type: string }
        lon: { type: number }
        lat: { type: number }
    SpotCapture:
      type: object
      required: [spot_id, captured_at]
      additionalProperties: false
      properties:
        spot_id: { type: integer }
        captured_at: { type: string, format: date-time }
