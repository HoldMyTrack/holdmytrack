openapi: 3.0.3
info:
  title: HoldMyTrack API
  version: v1
  description: >-
    The JSON contract between the Go server and its clients: this file indexes every path, each
    area's operations are in paths/, and the shapes they share in components/. The httpapi
    package's tests check every request and response they make against it, so a handler that
    stops matching it fails CI. A browser's write from another site is
    refused with a plain-text 403 before any operation runs; the operations don't repeat it.
servers:
  - url: /v1
security:
  - session: []
paths:
  /auth/signup:
    $ref: "paths/auth.yaml#/auth_signup"
  /auth/login:
    $ref: "paths/auth.yaml#/auth_login"
  /auth/logout:
    $ref: "paths/auth.yaml#/auth_logout"
  /auth/me:
    $ref: "paths/auth.yaml#/auth_me"
  /auth/demo:
    $ref: "paths/auth.yaml#/auth_demo"
  /auth/forgot-password:
    $ref: "paths/auth.yaml#/auth_forgot-password"
  /auth/reset-password:
    $ref: "paths/auth.yaml#/auth_reset-password"
  /auth/verify-email:
    $ref: "paths/auth.yaml#/auth_verify-email"
  /auth/providers:
    $ref: "paths/auth.yaml#/auth_providers"
  /auth/google/start:
    $ref: "paths/auth.yaml#/auth_google_start"
  /auth/google/callback:
    $ref: "paths/auth.yaml#/auth_google_callback"
  /auth/facebook/start:
    $ref: "paths/auth.yaml#/auth_facebook_start"
  /auth/facebook/callback:
    $ref: "paths/auth.yaml#/auth_facebook_callback"
  /auth/google/token:
    $ref: "paths/auth.yaml#/auth_google_token"
  /auth/handoff:
    $ref: "paths/auth.yaml#/auth_handoff"
  /auth/resend-verification:
    $ref: "paths/auth.yaml#/auth_resend-verification"
  /auth/email:
    $ref: "paths/auth.yaml#/auth_email"
  /account:
    $ref: "paths/account.yaml#/account"
  /account/settings:
    $ref: "paths/account.yaml#/account_settings"
  /account/settings/options:
    $ref: "paths/account.yaml#/account_settings_options"
  /account/avatar:
    $ref: "paths/account.yaml#/account_avatar"
  /account/export:
    $ref: "paths/account.yaml#/account_export"
  /account/exports/{id}/parts/{n}:
    $ref: "paths/account.yaml#/account_exports_id_parts_n"
  /activities:
    $ref: "paths/activities.yaml#/activities"
  /activities/upload:
    $ref: "paths/activities.yaml#/activities_upload"
  /activities/{id}:
    $ref: "paths/activities.yaml#/activities_id"
  /activities/overlaps:
    $ref: "paths/activities.yaml#/activities_overlaps"
  /activities/summary:
    $ref: "paths/activities.yaml#/activities_summary"
  /activities/histogram:
    $ref: "paths/activities.yaml#/activities_histogram"
  /activities/graph-stats:
    $ref: "paths/activities.yaml#/activities_graph-stats"
  /activities/trends:
    $ref: "paths/activities.yaml#/activities_trends"
  /activities/status/{external_id}:
    $ref: "paths/activities.yaml#/activities_status_external_id"
  /activities/track-metrics/{id}:
    $ref: "paths/activities.yaml#/activities_track-metrics_id"
  /activities/track-points/{id}:
    $ref: "paths/activities.yaml#/activities_track-points_id"
  /activities/track-edit/{id}:
    $ref: "paths/activities.yaml#/activities_track-edit_id"
  /activities/track-merge:
    $ref: "paths/activities.yaml#/activities_track-merge"
  /map/style/{flavor}:
    $ref: "paths/map.yaml#/map_style_flavor"
  /photos:
    $ref: "paths/photos.yaml#/photos"
  /photos/place:
    $ref: "paths/photos.yaml#/photos_place"
  /photos/{id}:
    $ref: "paths/photos.yaml#/photos_id"
  /photos/{id}/thumb:
    $ref: "paths/photos.yaml#/photos_id_thumb"
  /private-locations:
    $ref: "paths/private-locations.yaml#/private-locations"
  /private-locations/{id}:
    $ref: "paths/private-locations.yaml#/private-locations_id"
  /stories:
    $ref: "paths/stories.yaml#/stories"
  /stories/{id}:
    $ref: "paths/stories.yaml#/stories_id"
  /stories/{id}/activities:
    $ref: "paths/stories.yaml#/stories_id_activities"
  /stories/{id}/send:
    $ref: "paths/stories.yaml#/stories_id_send"
  /story-sends:
    $ref: "paths/stories.yaml#/story-sends"
  /story-sends/{id}/accept:
    $ref: "paths/stories.yaml#/story-sends_id_accept"
  /story-sends/{id}:
    $ref: "paths/stories.yaml#/story-sends_id"
  /uploads:
    $ref: "paths/uploads.yaml#/uploads"
  /uploads/active:
    $ref: "paths/uploads.yaml#/uploads_active"
  /coverage/status:
    $ref: "paths/map.yaml#/coverage_status"
  /sync/activities:
    $ref: "paths/sync.yaml#/sync_activities"
  /sync/known:
    $ref: "paths/sync.yaml#/sync_known"
  /spots:
    $ref: "paths/spots.yaml#/spots"
  /spots/captures:
    $ref: "paths/spots.yaml#/spots_captures"
  /spots/{id}:
    $ref: "paths/spots.yaml#/spots_id"
  /spots/{id}/captures:
    $ref: "paths/spots.yaml#/spots_id_captures"
components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: A session id, as a bearer token or the session cookie.
