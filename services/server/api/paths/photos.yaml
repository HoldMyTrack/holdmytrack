photos:
  get:
    summary: One activity's photos, or those of every activity in a Story, in route order
    description: Exactly one of activity and story; activity wins when both are sent.
    parameters:
      - name: activity
        in: query
        schema: { type: string }
      - name: story
        in: query
        schema: { type: string }
    responses:
      "200":
        description: The photos
        content:
          application/json:
            schema:
              type: object
              required: [photos]
              additionalProperties: false
              properties:
                photos:
                  type: array
                  items: { $ref: "../components/schemas.yaml#/Photo" }
      "400": { $ref: "../components/responses.yaml#/PlainError" }
      "401": { $ref: "../components/responses.yaml#/Unauthenticated" }
      "403": { $ref: "../components/responses.yaml#/NotVerified" }
      "404": { $ref: "../components/responses.yaml#/PlainError" }
  post:
    summary: Add a photo to an activity, placed on its track
    description: >-
      The client sends a resized copy and its thumbnail, plus what it read from the original's
      EXIF before resizing. One the server can't place is refused with 422 photo_needs_place,
      and the client sends it again with the user's route_at.
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [activity_id, file, thumb]
            properties:
              activity_id: { type: string }
              file:
                type: string
                format: binary
                description: JPEG or WebP, at most 3 MiB and 2560 px on its long side.
              thumb:
                type: string
                format: binary
                description: JPEG or WebP, at most 256 KiB and 640 px on its long side.
              taken_at:
                type: string
                description: RFC 3339, when the file says its zone or carries a GPS time.
              taken_local:
                type: string
                description: 2006-01-02T15:04:05, a camera clock with no zone.
              lat: { type: number }
              lon: { type: number }
              route_at:
                type: string
                description: RFC 3339, where on the track the user put it.
              caption:
                type: string
                description: Trimmed; empty means none. Longer than 500 characters is a 400.
    responses:
      "201":
        description: The new photo
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/Photo" }
      "400": { $ref: "../components/responses.yaml#/PlainError" }
      "401": { $ref: "../components/responses.yaml#/Unauthenticated" }
      "403": { $ref: "../components/responses.yaml#/Forbidden" }
      "404": { $ref: "../components/responses.yaml#/PlainError" }
      "409":
        description: The account has the most photos allowed, or the activity has no track to put it on
        content:
          text/plain:
            schema: { type: string }
      "413": { $ref: "../components/responses.yaml#/PlainError" }
      "415": { $ref: "../components/responses.yaml#/PlainError" }
      "422":
        description: >-
          JSON photo_needs_place when nothing places the photo on the track (ask the user where
          and send route_at); plain text when an image is larger on a side than allowed
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/PhotoNeedsPlace" }
          text/plain:
            schema: { type: string }
      "503": { $ref: "../components/responses.yaml#/DailyCapacity" }
photos_place:
  post:
    summary: Where an upload with these fields would be placed, storing nothing
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              activity_id: { type: string }
              taken_at:
                type: string
                description: RFC 3339; missing or empty when unknown.
              taken_local:
                type: string
                description: 2006-01-02T15:04:05; missing or empty when unknown.
              lat: { type: number, nullable: true }
              lon: { type: number, nullable: true }
    responses:
      "200":
        description: The place
        content:
          application/json:
            schema:
              type: object
              required: [route_at, taken_at]
              additionalProperties: false
              properties:
                route_at: { type: string, format: date-time }
                taken_at: { type: string, format: date-time, nullable: true }
      "400": { $ref: "../components/responses.yaml#/PlainError" }
      "401": { $ref: "../components/responses.yaml#/Unauthenticated" }
      "403": { $ref: "../components/responses.yaml#/Forbidden" }
      "404": { $ref: "../components/responses.yaml#/PlainError" }
      "409": { $ref: "../components/responses.yaml#/PlainError" }
      "422": { $ref: "../components/responses.yaml#/PhotoNeedsPlace" }
photos_id:
  parameters:
    - $ref: "../components/parameters.yaml#/PhotoID"
  get:
    summary: The photo's image; it never changes under its id
    responses:
      "200": { $ref: "../components/responses.yaml#/PhotoImage" }
      "401": { $ref: "../components/responses.yaml#/Unauthenticated" }
      "403": { $ref: "../components/responses.yaml#/NotVerified" }
      "404": { $ref: "../components/responses.yaml#/PlainError" }
      "503": { $ref: "../components/responses.yaml#/DailyCapacity" }
  patch:
    summary: Change a photo's caption or its place on the track; only the fields sent change
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              caption:
                type: string
                nullable: true
                description: Trimmed; null or empty clears it. Longer than 500 characters is a 400.
              route_at:
                type: string
                format: date-time
                description: The photo's new moment on the track, clamped to it. Null is a 400.
    responses:
      "200":
        description: The photo as saved
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/Photo" }
      "400": { $ref: "../components/responses.yaml#/PlainError" }
      "401": { $ref: "../components/responses.yaml#/Unauthenticated" }
      "403": { $ref: "../components/responses.yaml#/Forbidden" }
      "404": { $ref: "../components/responses.yaml#/PlainError" }
      "409": { $ref: "../components/responses.yaml#/PlainError" }
  delete:
    summary: Remove a photo
    responses:
      "204":
        description: Removed
      "401": { $ref: "../components/responses.yaml#/Unauthenticated" }
      "403": { $ref: "../components/responses.yaml#/Forbidden" }
      "404": { $ref: "../components/responses.yaml#/PlainError" }
photos_id_thumb:
  parameters:
    - $ref: "../components/parameters.yaml#/PhotoID"
  get:
    summary: The photo's thumbnail; it never changes under its id
    responses:
      "200": { $ref: "../components/responses.yaml#/PhotoImage" }
      "401": { $ref: "../components/responses.yaml#/Unauthenticated" }
      "403": { $ref: "../components/responses.yaml#/NotVerified" }
      "404": { $ref: "../components/responses.yaml#/PlainError" }
      "503": { $ref: "../components/responses.yaml#/DailyCapacity" }
