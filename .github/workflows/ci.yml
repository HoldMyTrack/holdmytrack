# Runs the checks that already exist (docs/DEVELOPMENT.md's verification checklist) on every
# push and pull request. CI only: nothing here deploys. Auto-deploy is deliberately gated on
# backups existing first (docs/ROADMAP.md, "CI on push/PR").
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/server
    # The tests that need Postgres+PostGIS (internal/httpapi's dbtest_test.go) skip without
    # TEST_DATABASE_URL; this gives them one.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: holdmytrack
          POSTGRES_PASSWORD: holdmytrack
          POSTGRES_DB: holdmytrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U holdmytrack"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://holdmytrack:holdmytrack@localhost:5432/holdmytrack_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/server/go.mod
          cache-dependency-path: services/server/go.sum
      - run: go test -coverprofile=coverage.out ./...
      # Coverage of the Go unit tests only: the Playwright suites exercise far more of the
      # server but aren't instrumented. Informational (codecov.yml), never a merge gate, and
      # an upload failure doesn't fail the build.
      - uses: codecov/codecov-action@v5
        with:
          files: services/server/coverage.out
          flags: go
          token: ${{ secrets.CODECOV_TOKEN }}

  web:
    name: Web typecheck and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run verify:style

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android/holdmytrack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner's preinstalled Android SDK (ANDROID_HOME) has its licenses accepted, so
      # AGP downloads whatever platform compileSdk names that isn't there yet.
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:createDebugUnitTestCoverageReport
      # JaCoCo coverage of the JUnit tests in app/src/test, under its own `kotlin` flag so
      # the README's Kotlin badge reads it apart from Go's. Informational, like Go's.
      - uses: codecov/codecov-action@v5
        with:
          files: apps/android/holdmytrack/app/build/reports/coverage/test/debug/report.xml
          flags: kotlin
          token: ${{ secrets.CODECOV_TOKEN }}

  # `make verify verify-build`: the whole dev stack (db, rustfs, migrate, api) plus headless
  # Chromium, exactly as it runs locally.
  e2e:
    name: Map verification (make verify, verify-build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The basemap extract is gitignored and cut from a dated Protomaps build that the
      # bucket only keeps for about a week (apps/web/scripts/build-basemap.sh). Keyed on
      # that script, so bumping its BUILD pin or bbox cuts a fresh one; a cache miss after
      # the pinned build has aged out fails here with a 404, and the fix is bumping BUILD.
      - uses: actions/cache@v4
        id: basemap
        with:
          path: apps/web/public/basemap/basemap.pmtiles
          key: basemap-${{ hashFiles('apps/web/scripts/build-basemap.sh') }}
      - if: steps.basemap.outputs.cache-hit != 'true'
        run: make basemap
      - run: make verify verify-build
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: apps/web/tests/screenshots/
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs api migrate
