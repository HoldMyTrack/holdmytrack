# Codecov settings for .github/workflows/ci.yml's coverage uploads: Go (flag `go`), the
# Android app's Kotlin (flag `kotlin`) and the web app's TypeScript (flag `typescript`).
# Coverage is reported, not enforced: this project verifies most behavior live rather than
# through unit tests (docs/DEVELOPMENT.md, "Verification"), so a percentage threshold would
# gate on the wrong thing. Both status checks stay informational and never block a merge.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# No PR comment: the badges, the status checks and codecov.io carry the numbers, and a comment
# on every PR only added a notification email each time.
comment: false

# Paths are reported relative to the repo root; the Go module lives in services/server,
# JaCoCo reports the Android sources by package path alone, and c8 reports the web app's
# relative to apps/web.
fixes:
  - "github.com/HoldMyTrack/holdmytrack/services/server/::services/server/"
  - "dev/holdmytrack/android/::apps/android/holdmytrack/app/src/main/kotlin/dev/holdmytrack/android/"
  - "src/::apps/web/src/"
