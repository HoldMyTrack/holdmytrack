org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official

# Where the app reaches FitMap's API, baked into BuildConfig.API_BASE_URL at build time.
# 10.0.2.2 is the emulator's alias for the host machine's loopback, so this default talks to
# `make up` running on the host. On a physical device over USB, forward the port instead:
#   adb reverse tcp:8080 tcp:8080
#   ./gradlew installDebug -Pfitmap.apiBaseUrl=http://127.0.0.1:8080
fitmap.apiBaseUrl=http://10.0.2.2:8080
