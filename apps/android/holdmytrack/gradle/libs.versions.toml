[versions]
agp = "9.4.0"
# MapLibre Native for Android. 11.8.0 is where built-in `pmtiles://` support landed and
# 13.3.0 added its ambient cache, so anything in the 13.x line already speaks the same URL
# scheme the style document carries (apps/android/docs/ROADMAP.md, Phase 2).
maplibre = "13.6.1"
appcompat = "1.7.1"
# Material Components for Android — the Material 3 theme and widgets the Views UI is styled
# with (apps/android/docs/ROADMAP.md Phase 5, "Decide the UI toolkit"). 1.13.0 is the
# version the theme was built and verified against on device.
material = "1.13.0"
# The Health Connect client (Path 2's on-device read). 1.1.0 is the current stable; 1.2.0 is
# alpha only, and the PoC that measured this platform's behaviour ran against 1.1.0, so the
# app ships against the same API surface those findings were observed on.
healthConnect = "1.1.0"
lifecycle = "2.9.4"
coroutines = "1.10.2"
# Declared explicitly rather than inherited transitively: the app builds its own OkHttpClient
# (net/HoldMyTrackApi.kt) and hands that same instance to MapLibre Native, so the version is a
# direct compile dependency here, not an implementation detail of the map SDK. 4.12.0 is the
# version MapLibre 13.6.1's own POM already resolves to, so this pins rather than upgrades.
okhttp = "4.12.0"

[libraries]
maplibre = { module = "org.maplibre.gl:android-sdk", version.ref = "maplibre" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
health-connect = { module = "androidx.health.connect:connect-client", version.ref = "healthConnect" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
